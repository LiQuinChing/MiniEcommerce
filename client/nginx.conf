server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React routing fix
    location / {
        try_files $uri /index.html;
    }

    # Proxy API requests to Gateway
    location /api/ {
        proxy_pass http://host.docker.internal:8888;
    }

    location /uploads/ {
        proxy_pass http://host.docker.internal:8888;
    }
}