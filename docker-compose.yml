services:
  user-service:
    build:
      context: ./server/user-service
    container_name: user-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/users/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "8081:8081"

  payment-service:
    build:
      context: ./server/payment-service
    container_name: payment-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/payments/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "8083:8083"

  client:
    build:
      context: ./client
    container_name: mini-ecommerce-client
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    ports:
      - "5173:80"
