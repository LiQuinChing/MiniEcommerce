apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: mini-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: miniecommerce/payment-service:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: USER_SERVICE_URL
          value: http://user-service.mini-ecommerce.svc.cluster.local:8081
        ports:
        - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: mini-ecommerce
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
  - port: 8083
    targetPort: 8083