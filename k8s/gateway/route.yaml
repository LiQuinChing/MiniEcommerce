apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: main-route
  namespace: default
spec:
  parentRefs:
  - name: ecommerce-gateway
  rules:

  - matches:
      - path:
          type: PathPrefix
          value: /api/products
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /products
    backendRefs:
      - name: product-service
        port: 5000

  - matches:
    - path:
        type: PathPrefix
        value: /uploads
    backendRefs:
      - name: product-service
        port: 5000

  - matches:
    - path:
        type: PathPrefix
        value: /api/suppliers
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /suppliers
    backendRefs:
      - name: product-service
        port: 5000

  - matches:
      - path:
          type: PathPrefix
          value: /api/orders
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /orders
    backendRefs:
      - name: order-service
        port: 8080

  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend-app
      port: 80