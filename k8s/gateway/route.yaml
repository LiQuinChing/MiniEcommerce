apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ecommerce-route
spec:
  parentRefs:
  - name: ecommerce-gateway
  rules:

  - matches:
      - path:
          type: PathPrefix
          value: /api/products
    backendRefs:
      - name: product-service
        port: 5000

  - matches:
    - path:
        type: PathPrefix
        value: /uploads
    backendRefs:
      - name: product-service
        port: 5000

  - matches:
    - path:
        type: PathPrefix
        value: /api/suppliers
    backendRefs:
      - name: product-service
        port: 5000

  - matches:
      - path:
          type: PathPrefix
          value: /api/orders
    backendRefs:
      - name: order-service
        port: 8080